    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tailwind.css 공부하기</title>

    // 오해

    1. 세부적인 폰트나 컬러를 설정할 수 없다: 거짓, 설정할 수 있습니다.
