<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <!-- 
    문제:
        query string을 아래와 같이 만들어보세요.
        http://yourdomain.com/002.html?name=홍길동&age=30&city=서울
    -->
    <p>이렇게도 할 수 있습니다.</p>
    <a href="002.html?name=홍길동&age=30&city=서울">링크</a>
    <form action="002.html" method="get">
        <label for="name">이름:</label>
        <input type="text" id="name" name="name"><br>
        <label for="age">나이:</label>
        <input type="number" id="age" name="age"><br>
        <label for="city">도시:</label>
        <input type="text" id="city" name="city"><br>
        <input type="submit" value="제출">
    </form>
    <!-- 
    이렇게 바뀌든 저렇게 바뀌든 결국 만들어지는 query string은 '백엔드'에서 처리합니다. 우리는 바뀌는 것이 없습니다. 바뀐 정보가 백엔드로 전달되게 하려면 action에다가 백엔드 URL을 넣어주면 됩니다.
    -->
</body>
</html>
