<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        section {
            height: 1000px;
            border: 1px solid black;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <!-- 
    문제:
        a 태그 5개와 연결된 section 5개를 작성하고, 각 a 태그를 클릭했을 때 해당 section으로 이동하도록 만들어 보세요. 단, 이동하는 것이 눈으로 보이도록 section의 높이를 1000px로 설정해주세요.
    -->
    <a href="#one">one</a><br>
    <a href="#two">two</a><br>
    <a href="#three">three</a><br>
    <a href="#four">four</a><br>
    <a href="#five">five</a><br>
    <section id="one">one</section>
    <section id="two">two</section>
    <section id="three">three</section>
    <section id="four">four</section>
    <section id="five">five</section>
</body>
