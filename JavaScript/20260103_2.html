<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button id="btn">Click me!</button>

    <script>
        const user = {
            name: '재현',
            greet() {
                setTimeout(function () {
                    console.log(`안녕하세요 ${this.name}`);
                }.bind(this), 1000);
            }
        }

        user.greet();
    </script>
</body>

</html>
