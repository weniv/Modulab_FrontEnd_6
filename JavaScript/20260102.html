    <script>
        function Sun(year) {
            this.year = year;
        }

        Sun.prototype.새해맞이 = function (person) {
            this.year += 1;
            console.log("새해가 밝았습니다! 현재 연도:", this.year);
            person.age += 1;
            console.log("한 살 더 먹었습니다. 현재 나이:", person.age);
        };

        function Person(name, age) {
            this.name = name;
            this.age = age;
        }

        let sun = new Sun(2025);
        let me = new Person("김유진", 25);

        sun.새해맞이(me);
