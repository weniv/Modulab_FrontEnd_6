        // while (true) {

        const box = document.querySelector(".box");
        let key = '';
        let posX = 0;

        function move(event) {
            key = event.key
        }

        function stop(event) {
            key = '';
        }

        window.addEventListener("keydown", move);
        window.addEventListener("keyup", stop);

        function play() {

            switch (key) {
                case "ArrowLeft":
                    posX -= 10;
                    break;
                case "ArrowRight":
                    posX += 10;
                    break;
            }
            box.style.transform = `translate(${posX}px, 0)`;

            requestAnimationFrame(play);
        }

        requestAnimationFrame(play);


    </script>
