<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        input:valid {
            border: 3px solid teal;
        }

        input:invalid {
            border: 3px solid red;
        }
    </style>
</head>

<body>
    <form>
        <input type="text" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[a-zA-Z]).{8,}" required>
    </form>
</body>

</html>
