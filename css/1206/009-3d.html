<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            .card {
                perspective: 500px;
            }

            .item {
                width: 240px;
                height: 320px;
                background-color: lightpink;
                margin: 100px auto;
                position: relative;

                transition: all 2s;
                transform-style: preserve-3d;
            }

            .item::before,
            .item::after {
                position: absolute;
                width: 100%;
                height: 100%;
                backface-visibility: hidden;
            }

            .item::before {
                content: "앞면";
                background-color: lightgreen;
            }

            .item::after {
                content: "뒷면";
                background-color: lightseagreen;
                transform: rotateY(180deg);
            }

            .item:hover {
                transform: rotateY(180deg) rotateZ(45deg) translateZ(100px);
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="item"></div>
        </div>
    </body>
</html>
