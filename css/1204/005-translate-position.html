<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            .container {
                display: flex;
                gap: 10px;
                padding: 100px;
            }

            .box {
                width: 100px;
                border: solid 2px black;
                position: relative;
            }

            .box > div {
                width: 100px;
                height: 100px;
                background-color: lightcoral;
                opacity: 0.7;
                transition: all 1s;
            }

            .box > .item {
                background-color: lightseagreen;
            }

            .translate:hover {
                transform: translateY(100px);
            }

            .position:hover {
                position: absolute;
                top: 100px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <!-- 성능이 중요한 상황, 애니메이션 등 빈번한 위치 변경이 필요한 상황 -->
            <div class="box">
                <div class="translate">translate</div>
                <div class="item">item</div>
            </div>
            <!-- 정적인 레이아웃 배치, 다른 레이아웃에 영향을 줘야하는 상황 -->
            <div class="box">
                <div class="position">position</div>
                <div class="item">item</div>
            </div>
        </div>
    </body>
</html>
