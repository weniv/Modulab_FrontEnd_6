<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            .box {
                width: 200px;
                height: 200px;
                background-color: lightcoral;
                margin: 100px auto;

                /* 이 요소에 등록할 애니메이션 이름 */
                animation-name: move;

                /* 애니메이션의 한사이클을 진행하는데 걸리는 속도 */
                animation-duration: 2s;

                /* 애니메이션의 진행 속도를 제어 */
                animation-timing-function: ease-in-out;
                animation-timing-function: cubic-bezier(0.03, -0.58, 0.12, 1.16);
                animation-timing-function: steps(5);

                /* 시작 시점을 지연 */
                animation-delay: 1s;
                animation-delay: -1s;
                animation-delay: 0s;

                /* 애니메이션의 한싸이클을 재생하는 횟수 */
                animation-iteration-count: 3;
                animation-iteration-count: infinite;
                animation-iteration-count: 1;

                /* 애니메이션 재생 방향 */
                animation-direction: normal;
                /* 역방향 */
                animation-direction: reverse;
                /* 정방향, 역방향이 번갈아가며 재생 */
                animation-direction: alternate;
                /* 역방향, 정방향이 번갈아가며 재생 */
                animation-direction: alternate-reverse;

                /* 애니메이션의 실행 전후 스타일 지정 */
                animation-fill-mode: normal;
                /* 애니메이션이 종료된 후, 마지막 키프레임을 유지 */
                animation-fill-mode: forwards;
                /* 애니메이션이 시작되기 전, 첫 키프레임을 유지 */
                animation-fill-mode: backwards;
                animation-fill-mode: both;
                animation-direction: normal;
                animation-delay: 2s;

                /* 단축속성 */
                /* 지속시간, 지연시간의 순서 중요! */
                animation: move 3s steps(10) 0s infinite alternate-reverse backwards;

                /* 애니메이션 일시정지 */
                animation-play-state: running;
            }

            .box:hover {
                animation-play-state: paused;
            }

            @keyframes move {
                0% {
                    background-color: lightgreen;
                    transform: translate(-200px);
                }

                50% {
                    background-color: lightskyblue;
                }

                100% {
                    background-color: lightseagreen;
                    transform: translate(200px);
                }
            }

            .circle {
                width: 200px;
                height: 200px;
                border-radius: 100%;
                background-color: lightcoral;
                margin: 50px auto;
                animation: move-up-down 5s linear infinite alternate;
            }

            @keyframes move-up-down {
                0% {
                    transform: translateY(100px) translateX(-200px);
                }

                10% {
                    transform: translateY(-100px) translateX(-150px);
                }

                20% {
                    transform: translateY(100px) translateX(-100px);
                }

                30% {
                    transform: translateY(-100px) translateX(-50px);
                }

                40% {
                    transform: translateY(100px) translateX(0px);
                }

                50% {
                    transform: translateY(-100px) translateX(50px);
                }

                60% {
                    transform: translateY(100px) translateX(100px);
                }

                70% {
                    transform: translateY(-100px) translateX(150px);
                }

                80% {
                    transform: translateY(100px) translateX(200px);
                }

                90% {
                    transform: translateY(-100px) translateX(250px);
                }

                100% {
                    transform: translateY(100px) translateX(300px);
                }
            }
        </style>
    </head>
    <body>
        <div class="box"></div>
        <div class="circle"></div>
    </body>
</html>
