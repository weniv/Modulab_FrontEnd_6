<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            .container {
                height: 100vh;
                background-color: #eee;
                display: flex;
                /* flex-direction: column; */

                align-items: center;
            }

            .item {
                width: 300px;
                height: 100px;
                font-size: 32px;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .item:nth-child(odd) {
                background-color: lightcoral;
            }

            .item:nth-child(even) {
                background-color: lightgreen;
            }

            .item:nth-child(1) {
                /* item의 초기 크기를 설정. */
                /* 기본값. */
                flex-basis: auto;

                /* width, height와 다른점: 축의 방향에 따라 달라짐
                주축이 row일 경우: width값이 무시
                주축이 column일 경우: height값이 무시 */
                flex-basis: 200px;
                /* 최소한의 크기. 0 외에 다른 상숫값을 사용할 수 없음 */
                flex-basis: 0;
                flex-basis: auto;

                /* 할당할 수 있는 공간의 비율 지정. 여유 공간을 어떻게 나눠가질까? */
                /* 1. 모든 아이템의 기본 크기 계산
                2. 남은 여유 공간을 확인
                3. flex-grow 비율에 따라서 여유 공간을 분배 */
                /* 1/3 */
                /* flex-grow: 1;  */

                /* 공간이 부족할때 아이템을 줄이는 비율 지정. */
                /* 값이 0일 경우 축소되지 않음. */
                flex-shrink: 0;

                /* 아이템 개별 교차축 기준 정렬 지정 */
                align-self: flex-start;
                /* flex-item의 순서 */
                /* 논리적인 마크업 순서를 유지하면서 시각적인 아이템들의 순서를 변경(반응형에서 유용하게 사용) */
                order: 3;
            }
            .item:nth-child(2) {
                /* 2/3 */
                /* flex-grow: 2;  */
                flex-shrink: 1;
                order: 1;
            }
            .item:nth-child(3) {
                /* 아이템이 늘어나지 않음 */
                /* flex-grow: 0; */
                flex-shrink: 2;
                align-self: flex-end;
                order: 2;

                flex: 1 1 100px; /* flex-grow: 1, flex-shrink: 1, flex-basis: 100px */
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>
    </body>
</html>
