<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            .container {
                height: 100vh;
                background-color: #eee;
                display: flex;
                flex-wrap: wrap;

                /* 각 줄(flex 라인) 내에서 아이템을 정렬 */
                /* align-items: center; */
                /* 줄들 자체 정렬 */
                /* flex-wrap: wrap;으로 설정이 되어있고 flex-item들이 여러 줄인 경우 교차 축 기준 정렬 */
                align-content: flex-start;
                align-content: flex-end;
                align-content: center;
                /* 여러 줄들 사이에 동일한 간격 */
                align-content: space-between;
                /* 여러 줄들 주위에 동일한 간격 */
                align-content: space-around;
                /* 양끝, 여러 줄들 사이에 동일한 간격 */
                align-content: space-evenly;
                /* 여러 줄들을 컨테이너에 맞게 늘림 */
                align-content: stretch;

                /* gap: 50px; */
                /* 행간 열간 순으로 조정 */
                /* gap: 20px 50px; */
                /* 개별 설정도 가능! */
                row-gap: 20px;
                column-gap: 100px;

                /* flex-flow는 [flex-direction] [flex-wrap]의 단축속성 */
                flex-direction: column;
                flex-wrap: wrap;
                /* 위와 아래는 동일한 코드입니다. */
                flex-flow: column wrap;
            }

            .item {
                width: 100px;
                /* height: 100px; */
                font-size: 32px;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .item:nth-child(odd) {
                background-color: lightcoral;
            }

            .item:nth-child(even) {
                background-color: lightgreen;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item">5</div>
            <div class="item">6</div>
            <div class="item">7</div>
            <div class="item">8</div>
        </div>
    </body>
</html>
